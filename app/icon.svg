<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fresh360-fav-green" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="fresh360-fav-leaf" x1="16" y1="12" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- 360 Circular Orbit Arc -->
  <circle
    cx="24"
    cy="24"
    r="20"
    stroke="url(#fresh360-fav-green)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="98 24"
  />

  <!-- Outer orbital pulse dots -->
  <circle cx="24" cy="4" r="2.6" fill="#10B981" />
  <circle cx="44" cy="24" r="2.6" fill="#34D399" />
  <circle cx="24" cy="44" r="2.2" fill="#059669" />

  <!-- Pure Droplet / Leaf Motif in Center -->
  <path
    d="M24 10C24 10 15 21 15 27.5C15 32.47 19.03 36.5 24 36.5C28.97 36.5 33 32.47 33 27.5C33 21 24 10 24 10Z"
    fill="url(#fresh360-fav-leaf)"
  />

  <!-- Inner Leaf Vein Line -->
  <path
    d="M24 16V33M24 23L28 20M24 27L20 24"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
